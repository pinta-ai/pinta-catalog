schema_version: 1
id: pinta-musecode
name: Pinta Muse Code
version: 0.4.4-pta1010.1
runtime: node
artifact:
  type: npm-tarball
  url: https://registry.npmjs.org/@pinta-ai/pinta-musecode/-/pinta-musecode-0.4.4-pta1010.1.tgz
  sha256: "4842af561bebbc9f9cafface18b34182d5478125e1259703537768f920af4aa7"
  entrypoint: package/dist/index.js
ingest:
  via: manager
  type: musecode
targets:
  # Muse's hook contract is observed from its binary, not a published API.
  - client: musecode
    install:
      type: musecode
      dist_root: package/dist
      hooks_template: package/hooks/managed-hooks.template.json
      env_file_keys:
        OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: relay-endpoint
        OTEL_EXPORTER_OTLP_HEADERS: relay-token
guard:
  evaluates: true
