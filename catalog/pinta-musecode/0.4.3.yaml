schema_version: 1
id: pinta-musecode
name: Pinta Muse Code
version: 0.4.3
runtime: node
artifact:
  type: npm-tarball
  url: https://registry.npmjs.org/@pinta-ai/pinta-musecode/-/pinta-musecode-0.4.3.tgz
  sha256: "1bd6627df430dc8add426cbc045ed30da79effffe4e2defc818273ed6e5c3612"
  entrypoint: package/dist/index.js
ingest:
  via: manager
  type: musecode
targets:
  # Muse's hook contract is observed from its binary, not a published API.
  - client: musecode
    install:
      type: musecode
      dist_root: package/dist
      hooks_template: package/hooks/managed-hooks.template.json
      env_file_keys:
        OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: relay-endpoint
        OTEL_EXPORTER_OTLP_HEADERS: relay-token
guard:
  evaluates: true
