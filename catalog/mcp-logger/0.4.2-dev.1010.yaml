schema_version: 1
id: mcp-logger
name: MCP Logger
version: 0.4.2-dev.1010
runtime: node
artifact:
  type: npm-tarball
  url: https://registry.npmjs.org/@pinta-ai/mcp-logger/-/mcp-logger-0.4.2-dev.1010.tgz
  sha256: "2a1132ca0cfc2563f5614d601df9da50fe9cd4d3ea68e1ce7f344ec1ca643493"
  entrypoint: package/dist/cli/index.js
ingest:
  via: manager
  type: mcp
targets:
  - client: claude-desktop
    install:
      type: mcp-config-wrap
      detect:
        macos: ~/Library/Application Support/Claude/claude_desktop_config.json
        linux: ~/.config/Claude/claude_desktop_config.json
        windows: ~/AppData/Roaming/Claude/claude_desktop_config.json
      wrap:
        extra_args: []
        env_keys:
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: relay-endpoint
          OTEL_EXPORTER_OTLP_HEADERS: relay-token
  - client: cursor
    install:
      type: mcp-config-wrap
      detect:
        macos: ~/.cursor/mcp.json
        linux: ~/.cursor/mcp.json
        windows: ~/.cursor/mcp.json
      wrap:
        extra_args: []
        env_keys:
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: relay-endpoint
          OTEL_EXPORTER_OTLP_HEADERS: relay-token
  - client: cursor-cli
    install:
      type: mcp-config-wrap
      detect:
        macos: ~/.cursor/mcp.json
        linux: ~/.cursor/mcp.json
        windows: ~/.cursor/mcp.json
      wrap:
        extra_args: []
        env_keys:
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: relay-endpoint
          OTEL_EXPORTER_OTLP_HEADERS: relay-token
  - client: claude-code
    install:
      type: mcp-config-wrap
      detect:
        macos: ~/.claude.json
        linux: ~/.claude.json
        windows: ~/.claude.json
      wrap:
        extra_args: []
        env_keys:
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: relay-endpoint
          OTEL_EXPORTER_OTLP_HEADERS: relay-token
guard:
  evaluates: true
