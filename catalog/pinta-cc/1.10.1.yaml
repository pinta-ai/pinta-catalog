schema_version: 1
id: pinta-cc
name: Pinta CC
version: 1.10.1
runtime: node
artifact:
  type: npm-tarball
  url: https://registry.npmjs.org/@pinta-ai/pinta-cc/-/pinta-cc-1.10.1.tgz
  sha256: "ddeabacfa4f337ad82bdf88eacd3368f7c6e43181664bb22fbc0fc09288b6b27"
  entrypoint: package/dist/index.js
ingest:
  via: manager
  type: cc
targets:
  - client: claude-code-plugin
    install:
      type: claude-code-plugin
      plugin_slug: pinta-cc@pinta-ai
      plugin_root: package
      user_config:
        endpoint: relay-endpoint
        api_key: relay-token-raw
guard:
  evaluates: true
