schema_version: 1
id: pinta-cc
name: Pinta CC
version: 1.11.5-rc.1
runtime: node
artifact:
  type: npm-tarball
  url: https://registry.npmjs.org/@pinta-ai/pinta-cc/-/pinta-cc-1.11.5-rc.1.tgz
  sha256: "8a03853baf12f98e6343045556672daa976c7c5e09dc85f54cd8407037ebb3c9"
  entrypoint: package/dist/index.js
ingest:
  via: manager
  type: cc
targets:
  - client: claude-code-plugin
    install:
      type: claude-code-plugin
      plugin_slug: pinta-cc@pinta-ai
      plugin_root: package
      user_config:
        endpoint: relay-endpoint
        api_key: relay-token-raw
guard:
  evaluates: true
