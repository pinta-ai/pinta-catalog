schema_version: 1
id: pinta-cc
name: Pinta CC
version: 1.6.0
runtime: node
artifact:
  type: npm-tarball
  url: https://registry.npmjs.org/@pinta-ai/pinta-cc/-/pinta-cc-1.6.0.tgz
  sha256: "01dd7116d85e2d8c4b5fde10e86d4bfb6ff0a5f1d1331fee57331c356f0a1c52"
  entrypoint: package/dist/index.js
ingest:
  via: manager
  type: cc
targets:
  - client: claude-code-plugin
    install:
      type: claude-code-plugin
      plugin_slug: pinta-cc@pinta-ai
      plugin_root: package
      user_config:
        endpoint: relay-endpoint
        api_key: relay-token-raw
guard:
  evaluates: true
