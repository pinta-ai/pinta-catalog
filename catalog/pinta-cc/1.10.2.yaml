schema_version: 1
id: pinta-cc
name: Pinta CC
version: 1.10.2
runtime: node
artifact:
  type: npm-tarball
  url: https://registry.npmjs.org/@pinta-ai/pinta-cc/-/pinta-cc-1.10.2.tgz
  sha256: "206b2596d3fad2104e04e9d9f5772909a57bdf2bd1713660866b18563d0204c0"
  entrypoint: package/dist/index.js
ingest:
  via: manager
  type: cc
targets:
  - client: claude-code-plugin
    install:
      type: claude-code-plugin
      plugin_slug: pinta-cc@pinta-ai
      plugin_root: package
      user_config:
        endpoint: relay-endpoint
        api_key: relay-token-raw
guard:
  evaluates: true
