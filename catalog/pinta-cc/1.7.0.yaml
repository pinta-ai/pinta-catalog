schema_version: 1
id: pinta-cc
name: Pinta CC
version: 1.7.0
runtime: node
artifact:
  type: npm-tarball
  url: https://registry.npmjs.org/@pinta-ai/pinta-cc/-/pinta-cc-1.7.0.tgz
  sha256: "64c3bbd3551583adf1ccaf9a5e4a8aa2d7c6f4826924faf53bfa44084ff33a7d"
  entrypoint: package/dist/index.js
ingest:
  via: manager
  type: cc
targets:
  - client: claude-code-plugin
    install:
      type: claude-code-plugin
      plugin_slug: pinta-cc@pinta-ai
      plugin_root: package
      user_config:
        endpoint: relay-endpoint
        api_key: relay-token-raw
guard:
  evaluates: true
