  url: https://registry.npmjs.org/@pinta-ai/pinta-cc/-/pinta-cc-1.11.1.tgz
  sha256: "8071527f01db2bc1f5fe16b89787700310f435d8f22b58eb733ed947ecb480c7"
  entrypoint: package/dist/index.js
ingest:
  via: manager
  type: cc
targets:
