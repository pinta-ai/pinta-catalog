schema_version: 1
id: pinta-cc
name: Pinta CC
version: 1.7.1
runtime: node
artifact:
  type: npm-tarball
  url: https://registry.npmjs.org/@pinta-ai/pinta-cc/-/pinta-cc-1.7.1.tgz
  sha256: "279c4f27cf5f299062a1b0fe2c4546edfe56954765a28a2838521b8c7241f854"
  entrypoint: package/dist/index.js
ingest:
  via: manager
  type: cc
targets:
  - client: claude-code-plugin
    install:
      type: claude-code-plugin
      plugin_slug: pinta-cc@pinta-ai
      plugin_root: package
      user_config:
        endpoint: relay-endpoint
        api_key: relay-token-raw
guard:
  evaluates: true
