schema_version: 1
id: pinta-cc
name: Pinta CC
version: 1.11.2
runtime: node
artifact:
  type: npm-tarball
  url: https://registry.npmjs.org/@pinta-ai/pinta-cc/-/pinta-cc-1.11.2.tgz
  sha256: "e8915a1f79461ac950ebff1bd79d40b7f4f1126b72af78752759b4cb7f98a08b"
  entrypoint: package/dist/index.js
ingest:
  via: manager
  type: cc
targets:
  - client: claude-code-plugin
    install:
      type: claude-code-plugin
      plugin_slug: pinta-cc@pinta-ai
      plugin_root: package
      user_config:
        endpoint: relay-endpoint
        api_key: relay-token-raw
guard:
  evaluates: true
