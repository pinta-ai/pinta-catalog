schema_version: 1
id: pinta-gemini
name: Pinta Gemini
version: 0.14.3-rc.1
runtime: node
artifact:
  type: npm-tarball
  url: https://registry.npmjs.org/@pinta-ai/pinta-gemini/-/pinta-gemini-0.14.3-rc.1.tgz
  sha256: "b12f45df1c0e26b75af32b0c299016d737dba1d66d69f5fd875c40632c101bbd"
  entrypoint: package/dist/index.js
ingest:
  via: manager
  type: gemini
targets:
  # The shared adaptor covers Gemini CLI and Antigravity; enrollment chooses the host.
  - client: gemini
    install:
      type: gemini-plugin
      dist_root: package/dist
      env_file_keys:
        GEMINI_PLUGIN_OPTION_ENDPOINT: relay-endpoint
        GEMINI_PLUGIN_OPTION_HEADERS: relay-token
guard:
  evaluates: true
