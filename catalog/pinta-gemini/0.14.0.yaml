schema_version: 1
id: pinta-gemini
name: Pinta Gemini
version: 0.14.0
runtime: node
artifact:
  type: npm-tarball
  url: https://registry.npmjs.org/@pinta-ai/pinta-gemini/-/pinta-gemini-0.14.0.tgz
  sha256: "faa4effcbbf5e43c7bd95e3296f9e923c9d0159f9f1f2ea6dceb92ab5ef1a338"
  entrypoint: package/dist/index.js
ingest:
  via: manager
  type: gemini
targets:
  # The shared adaptor covers Gemini CLI and Antigravity; enrollment chooses the host.
  - client: gemini
    install:
      type: gemini-plugin
      dist_root: package/dist
      env_file_keys:
        GEMINI_PLUGIN_OPTION_ENDPOINT: relay-endpoint
        GEMINI_PLUGIN_OPTION_HEADERS: relay-token
guard:
  evaluates: true
