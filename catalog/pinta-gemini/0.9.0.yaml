schema_version: 1
id: pinta-gemini
name: Pinta Gemini
version: 0.9.0
runtime: node
artifact:
  type: npm-tarball
  url: https://registry.npmjs.org/@pinta-ai/pinta-gemini/-/pinta-gemini-0.9.0.tgz
  sha256: "9398ec468bd41aa1a110aea0abf136a91630aa2c10eb712afff8b4642c7fb0a2"
  entrypoint: package/dist/index.js
ingest:
  via: manager
  type: gemini
targets:
  # One adaptor binary covers BOTH Gemini-family hosts (single --agent arg):
  #   - Gemini CLI    → ~/.gemini/extensions/pinta-gemini/ (extension; bypasses
  #                     the folder-trust gate that skips settings.json hooks)
  #   - Antigravity   → ~/.gemini/config/hooks.json (global; agy v1.0.x + 2.0)
  # The enroll module (gemini-plugin) builds both hook structures in code, so
  # there is no hooks_template. PINTA_GUARD_ENDPOINT is injected by the enroll
  # module. Namespaced GEMINI_PLUGIN_OPTION_* so they don't collide with Gemini
  # CLI's own native OTel (which reads OTEL_EXPORTER_OTLP_*).
  - client: gemini
    install:
      type: gemini-plugin
      dist_root: package/dist
      env_file_keys:
        GEMINI_PLUGIN_OPTION_ENDPOINT: relay-endpoint
        GEMINI_PLUGIN_OPTION_HEADERS: relay-token
guard:
  evaluates: true
