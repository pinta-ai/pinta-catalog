schema_version: 1
id: pinta-gemini
name: Pinta Gemini
version: 0.13.0
runtime: node
artifact:
  type: npm-tarball
  url: https://registry.npmjs.org/@pinta-ai/pinta-gemini/-/pinta-gemini-0.13.0.tgz
  sha256: "a6056c27407b83a377d70ee084d16749d8da6b132eec635f2c8131e456d5294e"
  entrypoint: package/dist/index.js
ingest:
  via: manager
  type: gemini
targets:
  # One adaptor binary covers BOTH Gemini-family hosts (single --agent arg):
  #   - Gemini CLI    -> ~/.gemini/extensions/pinta-gemini/
  #   - Antigravity   -> ~/.gemini/config/hooks.json
  # The enroll module builds both hook structures and injects the guard endpoint.
  - client: gemini
    install:
      type: gemini-plugin
      dist_root: package/dist
      env_file_keys:
        GEMINI_PLUGIN_OPTION_ENDPOINT: relay-endpoint
        GEMINI_PLUGIN_OPTION_HEADERS: relay-token
guard:
  evaluates: true
