schema_version: 1
id: pinta-gemini
name: Pinta Gemini
version: 0.14.2-pta1010.1
runtime: node
artifact:
  type: npm-tarball
  url: https://registry.npmjs.org/@pinta-ai/pinta-gemini/-/pinta-gemini-0.14.2-pta1010.1.tgz
  sha256: "683e61d536a25428e7f1d2e55304f6e260665397d0a1e60e2a157c22d5b5cb0a"
  entrypoint: package/dist/index.js
ingest:
  via: manager
  type: gemini
targets:
  # The shared adaptor covers Gemini CLI and Antigravity; enrollment chooses the host.
  - client: gemini
    install:
      type: gemini-plugin
      dist_root: package/dist
      env_file_keys:
        GEMINI_PLUGIN_OPTION_ENDPOINT: relay-endpoint
        GEMINI_PLUGIN_OPTION_HEADERS: relay-token
guard:
  evaluates: true
