schema_version: 1
id: pinta-opencode
name: Pinta Opencode
version: 0.10.0
runtime: node
artifact:
  type: npm-tarball
  url: https://registry.npmjs.org/@pinta-ai/pinta-opencode/-/pinta-opencode-0.10.0.tgz
  sha256: "c19d10322b4f6361ddb9f2b93f7d9cf2ef7f52f51d7f6669d2c99a0b351cee32"
  entrypoint: package/dist/plugin.js
ingest:
  via: manager
  type: opencode
targets:
  - client: opencode
    install:
      type: opencode-plugin
      dist_root: package/dist
      package_name: "@pinta-ai/pinta-opencode"
      plugin_options:
        endpoint: relay-endpoint
        guard: relay-guard-endpoint
        token: relay-token-raw
      env_file_keys:
        PINTA_OPENCODE_ENDPOINT: relay-endpoint
        PINTA_OPENCODE_GUARD: relay-guard-endpoint
        PINTA_OPENCODE_TOKEN: relay-token-raw
guard:
  evaluates: true
