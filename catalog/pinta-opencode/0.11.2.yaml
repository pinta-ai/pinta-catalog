schema_version: 1
id: pinta-opencode
name: Pinta Opencode
version: 0.11.2
runtime: node
artifact:
  type: npm-tarball
  url: https://registry.npmjs.org/@pinta-ai/pinta-opencode/-/pinta-opencode-0.11.2.tgz
  sha256: "d67507aaf165a0af4bf8ff971982bfd151414ea53b14f76e5c4a616326aeda8f"
  entrypoint: package/dist/plugin.js
ingest:
  via: manager
  type: opencode
targets:
  - client: opencode
    install:
      type: opencode-plugin
      dist_root: package/dist
      package_name: "@pinta-ai/pinta-opencode"
      plugin_options:
        endpoint: relay-endpoint
        guard: relay-guard-endpoint
        token: relay-token-raw
      env_file_keys:
        PINTA_OPENCODE_ENDPOINT: relay-endpoint
        PINTA_OPENCODE_GUARD: relay-guard-endpoint
        PINTA_OPENCODE_TOKEN: relay-token-raw
guard:
  evaluates: true
