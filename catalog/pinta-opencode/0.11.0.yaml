schema_version: 1
id: pinta-opencode
name: Pinta Opencode
version: 0.11.0
runtime: node
artifact:
  type: npm-tarball
  url: https://registry.npmjs.org/@pinta-ai/pinta-opencode/-/pinta-opencode-0.11.0.tgz
  sha256: "a0235d0c660f16b9e06b68494baa4ee8058b4192b06ef9775fd4f3f96cad015f"
  entrypoint: package/dist/plugin.js
ingest:
  via: manager
  type: opencode
targets:
  - client: opencode
    install:
      type: opencode-plugin
      dist_root: package/dist
      package_name: "@pinta-ai/pinta-opencode"
      plugin_options:
        endpoint: relay-endpoint
        guard: relay-guard-endpoint
        token: relay-token-raw
      env_file_keys:
        PINTA_OPENCODE_ENDPOINT: relay-endpoint
        PINTA_OPENCODE_GUARD: relay-guard-endpoint
        PINTA_OPENCODE_TOKEN: relay-token-raw
guard:
  evaluates: true
