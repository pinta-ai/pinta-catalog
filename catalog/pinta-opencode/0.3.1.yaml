schema_version: 1
id: pinta-opencode
name: Pinta Opencode
version: 0.3.1
runtime: node
artifact:
  type: npm-tarball
  url: https://registry.npmjs.org/@pinta-ai/pinta-opencode/-/pinta-opencode-0.3.1.tgz
  sha256: "4ec2eb153fb157a682850e2d574d6fbb7aba5a2548f1246df357270947808db2"
  entrypoint: package/dist/plugin.js
ingest:
  via: manager
  type: opencode
targets:
  # opencode loads the plugin in-process via ~/.config/opencode/opencode.json
  # (plugin array of [package_name, options]) plus a sibling
  # ~/.config/opencode/pinta-opencode.env file for the relay credentials.
  - client: opencode
    install:
      type: opencode-plugin
      dist_root: package/dist
      package_name: "@pinta-ai/pinta-opencode"
      plugin_options:
        endpoint: relay-endpoint
        guard: relay-guard-endpoint
        token: relay-token-raw
      env_file_keys:
        PINTA_OPENCODE_ENDPOINT: relay-endpoint
        PINTA_OPENCODE_GUARD: relay-guard-endpoint
        PINTA_OPENCODE_TOKEN: relay-token-raw
guard:
  evaluates: true
