schema_version: 1
id: pinta-cursor-cli
name: Pinta Cursor CLI
version: 0.1.2-pta1010.1
runtime: node
artifact:
  type: npm-tarball
  url: https://github.com/pinta-ai/pinta-cursor-cli/releases/download/v0.1.2-pta1010.1/pinta-ai-pinta-cursor-cli-0.1.2-pta1010.1.tgz
  sha256: "0480e2c5fdc910c155e29c398bb0d8a7df6a9f342845cad8cfbfdd17ab710de3"
  entrypoint: package/dist/index.js
ingest:
  via: manager
  type: cursor
targets:
  - client: cursor
    install:
      type: cursor-hooks
      dist_root: package/dist
      hooks_template: package/hooks/hooks.template.json
      env_file_keys:
        OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: relay-endpoint
        OTEL_EXPORTER_OTLP_HEADERS: relay-token
  - client: cursor-cli
    install:
      type: cursor-hooks
      dist_root: package/dist
      hooks_template: package/hooks/hooks.template.json
      env_file_keys:
        OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: relay-endpoint
        OTEL_EXPORTER_OTLP_HEADERS: relay-token
guard:
  evaluates: true
