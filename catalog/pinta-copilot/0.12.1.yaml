schema_version: 1
id: pinta-copilot
name: Pinta Copilot
version: 0.12.1
runtime: node
artifact:
  type: npm-tarball
  url: https://registry.npmjs.org/@pinta-ai/pinta-copilot/-/pinta-copilot-0.12.1.tgz
  sha256: "f9eec2a17490f893e37f45c05a1cc18f57c494cb320b611c32c591cbfd280022"
  entrypoint: package/dist/index.js
ingest:
  via: manager
  type: copilot
targets:
  - client: copilot
    install:
      type: copilot
      dist_root: package/dist
      env_file_keys:
        COPILOT_PLUGIN_OPTION_ENDPOINT: relay-endpoint
        COPILOT_PLUGIN_OPTION_HEADERS: relay-token
guard:
  evaluates: true
