schema_version: 1
id: pinta-copilot
name: Pinta Copilot
version: 0.12.2-rc.2
runtime: node
artifact:
  type: npm-tarball
  url: https://registry.npmjs.org/@pinta-ai/pinta-copilot/-/pinta-copilot-0.12.2-rc.2.tgz
  sha256: "1c5a52315f41818332cfb6abaf44589b9efc551abcf33a0e9a23ccb502969ec2"
  entrypoint: package/dist/index.js
ingest:
  via: manager
  type: copilot
targets:
  - client: copilot
    install:
      type: copilot
      dist_root: package/dist
      env_file_keys:
        COPILOT_PLUGIN_OPTION_ENDPOINT: relay-endpoint
        COPILOT_PLUGIN_OPTION_HEADERS: relay-token
guard:
  evaluates: true
