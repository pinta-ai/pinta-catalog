schema_version: 1
id: pinta-copilot
name: Pinta Copilot
version: 0.12.1-pta1010.1
runtime: node
artifact:
  type: npm-tarball
  url: https://registry.npmjs.org/@pinta-ai/pinta-copilot/-/pinta-copilot-0.12.1-pta1010.1.tgz
  sha256: "12eafa11bf062e3063fde154ab6d89c0f3eeebe87bbd551637eaef9f02bfe6ac"
  entrypoint: package/dist/index.js
ingest:
  via: manager
  type: copilot
targets:
  - client: copilot
    install:
      type: copilot
      dist_root: package/dist
      env_file_keys:
        COPILOT_PLUGIN_OPTION_ENDPOINT: relay-endpoint
        COPILOT_PLUGIN_OPTION_HEADERS: relay-token
guard:
  evaluates: true
